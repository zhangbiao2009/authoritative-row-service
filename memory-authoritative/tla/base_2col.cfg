\* Two columns: checks that only dirty columns are written and that the mask is merged back on failure (current design with hole 4 fixed, preconditions of holes 1-3 removed; expected to pass)
SPECIFICATION Spec
CONSTANTS
    Clients = {c1, c2}
    Cols = {1, 2}
    MaxEntry = 2
    MaxGen = 1
    MaxVal = 3
    MaxOps = 3
    MaxStmtTimeouts = 1
    MaxDrops = 1
    MaxClientTimeouts = 0
    MaxCrashes = 0
    InsertCanBeLate = FALSE
    RetryCreate = FALSE
    FixDedup = FALSE
    FixFence = FALSE
    FixUnsureRetry = TRUE
    MaxFlips = 0
    MaxQueueTimeouts = 0
    MaxZombieStmts = 0
    RetryWhileBusy = FALSE
    FixCrossRow = FALSE
    FixRetryAnswer = FALSE
    FixSdkRetry = FALSE
    FixEpoch = FALSE
    Mut = "none"
INVARIANTS
    NoViolation
    NoResurrection
    MemMatchesAbs
    QuiescentConsistent
    DbMatchesAbsWhenIdle
    CreateDurable
    OneWriterPerKey
    DirtyImpliesQueued
    QueuedIsTracked
    LiveEntryInMap
    NoDirtyEviction
    DbValsBelongToGen
    DbNotAhead
    CleanIsDurable
    FencedRestart
PROPERTIES
    DbVerMonotonic
SYMMETRY Symm
