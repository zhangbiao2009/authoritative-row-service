\* Liveness: all faults (each bounded) + the fixes, under weak fairness (FairSpec). Smaller than fixed.cfg because
\* liveness checking is far more expensive than safety checking. No SYMMETRY: TLC does not support it soundly for liveness.
\* Every fix is on; the faults of holes 5-8 are off (their safety is checked by "python3 suite.py ext").
SPECIFICATION FairSpec
CONSTANTS
    Clients = {c1, c2}
    Cols = {1}
    MaxEntry = 2
    MaxGen = 2
    MaxVal = 1
    MaxOps = 2
    MaxStmtTimeouts = 1
    MaxDrops = 1
    MaxClientTimeouts = 1
    MaxCrashes = 1
    InsertCanBeLate = TRUE
    RetryCreate = TRUE
    FixDedup = TRUE
    FixFence = TRUE
    FixUnsureRetry = TRUE
    MaxFlips = 0
    MaxQueueTimeouts = 0
    MaxZombieStmts = 0
    RetryWhileBusy = FALSE
    FixCrossRow = TRUE
    FixRetryAnswer = TRUE
    FixSdkRetry = TRUE
    FixEpoch = TRUE
    Mut = "none"
INVARIANTS
    NoViolation
    NoResurrection
    MemMatchesAbs
    QuiescentConsistent
    DbMatchesAbsWhenIdle
    CreateDurable
    OneWriterPerKey
    DirtyImpliesQueued
    QueuedIsTracked
    LiveEntryInMap
    NoDirtyEviction
    DbValsBelongToGen
    DbNotAhead
    CleanIsDurable
    FencedRestart
PROPERTIES
    DbVerMonotonic
    EventuallyResponds
    BackgroundSettles
    EventuallyFlushed
    NoLockLeak
