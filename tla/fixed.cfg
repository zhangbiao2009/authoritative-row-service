\* 修复方案：所有故障都打开，加上 gen 去重表和重启清理会话（预期通过）
SPECIFICATION Spec
CONSTANTS
    Clients = {c1, c2}
    Cols = {1}
    MaxEntry = 3
    MaxGen = 2
    MaxVal = 2
    MaxOps = 3
    MaxStmtTimeouts = 1
    MaxDrops = 1
    MaxClientTimeouts = 1
    MaxCrashes = 1
    InsertCanBeLate = TRUE
    RetryCreate = TRUE
    FixDedup = TRUE
    FixFence = TRUE
    FixUnsureRetry = TRUE
INVARIANTS
    NoViolation
    NoResurrection
    MemMatchesAbs
    QuiescentConsistent
    DbMatchesAbsWhenIdle
    CreateDurable
    OneWriterPerKey
    DirtyImpliesQueued
    QueuedIsTracked
    LiveEntryInMap
SYMMETRY Symm
