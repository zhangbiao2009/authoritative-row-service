\* The fixes: all faults enabled, plus the gen dedup table and the startup session fence (expected to pass)
SPECIFICATION Spec
CONSTANTS
    Clients = {c1, c2}
    Cols = {1}
    MaxEntry = 3
    MaxGen = 2
    MaxVal = 2
    MaxOps = 3
    MaxStmtTimeouts = 1
    MaxDrops = 1
    MaxClientTimeouts = 1
    MaxCrashes = 1
    InsertCanBeLate = TRUE
    RetryCreate = TRUE
    FixDedup = TRUE
    FixFence = TRUE
    FixUnsureRetry = TRUE
INVARIANTS
    NoViolation
    NoResurrection
    MemMatchesAbs
    QuiescentConsistent
    DbMatchesAbsWhenIdle
    CreateDurable
    OneWriterPerKey
    DirtyImpliesQueued
    QueuedIsTracked
    LiveEntryInMap
SYMMETRY Symm
