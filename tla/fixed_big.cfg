\* Large random simulation: 3 clients, two columns, each fault up to 2 times; all faults + the fixes (./run.sh fixed_big -simulate -depth 300)
SPECIFICATION Spec
CONSTANTS
    Clients = {c1, c2, c3}
    Cols = {1, 2}
    MaxEntry = 4
    MaxGen = 3
    MaxVal = 4
    MaxOps = 4
    MaxStmtTimeouts = 2
    MaxDrops = 2
    MaxClientTimeouts = 2
    MaxCrashes = 2
    InsertCanBeLate = TRUE
    RetryCreate = TRUE
    FixDedup = TRUE
    FixFence = TRUE
    FixUnsureRetry = TRUE
    Mut = "none"
INVARIANTS
    NoViolation
    NoResurrection
    MemMatchesAbs
    QuiescentConsistent
    DbMatchesAbsWhenIdle
    CreateDurable
    OneWriterPerKey
    DirtyImpliesQueued
    QueuedIsTracked
    LiveEntryInMap
    NoDirtyEviction
    DbValsBelongToGen
    DbNotAhead
    CleanIsDurable
    FencedRestart
PROPERTIES
    DbVerMonotonic
