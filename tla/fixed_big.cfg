\* 大规模随机模拟：3 个客户端、两列、各种故障各 2 次，所有故障 + 修复方案（./run.sh fixed_big -simulate -depth 300）
SPECIFICATION Spec
CONSTANTS
    Clients = {c1, c2, c3}
    Cols = {1, 2}
    MaxEntry = 4
    MaxGen = 3
    MaxVal = 4
    MaxOps = 4
    MaxStmtTimeouts = 2
    MaxDrops = 2
    MaxClientTimeouts = 2
    MaxCrashes = 2
    InsertCanBeLate = TRUE
    RetryCreate = TRUE
    FixDedup = TRUE
    FixFence = TRUE
    FixUnsureRetry = TRUE
INVARIANTS
    NoViolation
    NoResurrection
    MemMatchesAbs
    QuiescentConsistent
    DbMatchesAbsWhenIdle
    CreateDurable
    OneWriterPerKey
    DirtyImpliesQueued
    QueuedIsTracked
    LiveEntryInMap
