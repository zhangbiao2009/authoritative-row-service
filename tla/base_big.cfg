\* Large random simulation: 3 clients, two columns, each fault up to 2 times; current design with hole 4 fixed and the preconditions of holes 1-3 removed (./run.sh base_big -simulate -depth 300)
SPECIFICATION Spec
CONSTANTS
    Clients = {c1, c2, c3}
    Cols = {1, 2}
    MaxEntry = 4
    MaxGen = 3
    MaxVal = 4
    MaxOps = 4
    MaxStmtTimeouts = 2
    MaxDrops = 2
    MaxClientTimeouts = 2
    MaxCrashes = 0
    InsertCanBeLate = FALSE
    RetryCreate = FALSE
    FixDedup = FALSE
    FixFence = FALSE
    FixUnsureRetry = TRUE
INVARIANTS
    NoViolation
    NoResurrection
    MemMatchesAbs
    QuiescentConsistent
    DbMatchesAbsWhenIdle
    CreateDurable
    OneWriterPerKey
    DirtyImpliesQueued
    QueuedIsTracked
    LiveEntryInMap
