\* 大规模随机模拟：3 个客户端、两列、各种故障各 2 次，当前设计修好漏洞 4、去掉漏洞 1～3 的前提（./run.sh base_big -simulate -depth 300）
SPECIFICATION Spec
CONSTANTS
    Clients = {c1, c2, c3}
    Cols = {1, 2}
    MaxEntry = 4
    MaxGen = 3
    MaxVal = 4
    MaxOps = 4
    MaxStmtTimeouts = 2
    MaxDrops = 2
    MaxClientTimeouts = 2
    MaxCrashes = 0
    InsertCanBeLate = FALSE
    RetryCreate = FALSE
    FixDedup = FALSE
    FixFence = FALSE
    FixUnsureRetry = TRUE
INVARIANTS
    NoViolation
    NoResurrection
    MemMatchesAbs
    QuiescentConsistent
    DbMatchesAbsWhenIdle
    CreateDurable
    OneWriterPerKey
    DirtyImpliesQueued
    QueuedIsTracked
    LiveEntryInMap
